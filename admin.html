<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BloodConnect — Admin Dashboard</title><link rel="stylesheet" href="style.css"><style>
.admin-page{min-height:100vh;background:#fffaf8}.admin-nav{height:72px;background:#fff;border-bottom:1px solid #eadfdb;display:flex;align-items:center;justify-content:space-between;padding:0 6%}.admin-main{padding:45px 6%;max-width:1400px;margin:auto}.admin-header{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px}.admin-header h1{font:700 42px/1.1 'Playfair Display',serif;margin:5px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:25px}.stat{background:#fff;border:1px solid #eadfdb;border-radius:15px;padding:20px}.stat b{font-size:28px;display:block}.stat span{font-size:12px;color:#777}.panel{background:#fff;border:1px solid #eadfdb;border-radius:15px;padding:20px;margin-bottom:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{border:1px solid #eadfdb;background:#fff;border-radius:9px;padding:9px 13px;font-weight:700}.tabs button.active{background:#b91c1c;color:#fff;border-color:#b91c1c}.table-wrap{overflow:auto}.admin-table{width:100%;border-collapse:collapse;font-size:12px}.admin-table th,.admin-table td{text-align:left;padding:11px;border-bottom:1px solid #eee;white-space:nowrap}.admin-table th{font-size:10px;color:#777;text-transform:uppercase}.mini{border:0;border-radius:7px;padding:7px 9px;font-size:11px;font-weight:700}.ok{background:#eaf7ee;color:#15803d}.no{background:#fff0ed;color:#b91c1c}.notice{padding:12px;background:#fff7e8;border:1px solid #f2dfb2;border-radius:10px;font-size:12px;margin-bottom:18px}.login-panel{max-width:440px;margin:90px auto;background:#fff;border:1px solid #eadfdb;border-radius:18px;padding:30px;box-shadow:0 18px 50px #3d17120d}.login-panel label{font-size:12px;font-weight:700;display:block;margin:12px 0}.login-panel input{margin-top:5px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.admin-header{align-items:start;flex-direction:column}.admin-main{padding:30px 4%}}
</style></head><body class="admin-page"><header class="admin-nav"><a class="brand" href="index.html">♥ <b>Blood<span>Connect</span></b></a><div><button class="btn ghost" id="refresh">↻ Refresh</button> <button class="btn primary" id="logout">Logout</button></div></header><main class="admin-main"><div id="loginPanel" class="login-panel"><small class="eyebrow">SECURE ADMIN AREA</small><h2>Administrator Login</h2><p style="font-size:12px;color:#777">Use the account that has been promoted to the <b>admin</b> role in Supabase.</p><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn primary" style="width:100%">Login</button></form></div><div id="dashboard" class="hidden"><div class="admin-header"><div><small class="eyebrow">ADMIN CONTROL CENTER</small><h1>Dashboard</h1><p style="color:#777;font-size:13px">Verify requests, monitor donors and review responses.</p></div><span id="adminName"></span></div><div id="stats" class="stats"></div><div class="panel"><div class="tabs"><button data-tab="pending" class="active">Pending Requests</button><button data-tab="requests">All Requests</button><button data-tab="donors">Donors</button><button data-tab="responses">Responses</button></div><div id="content"></div></div></div></main><div id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
